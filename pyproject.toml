[tool.ruff]
# Lab 11: legacy-lab3 is old Lab 3 code, not part of the app under test
exclude = ["legacy-lab3"]

[tool.ruff.lint]
# Lab 11: static code security scan - only flag flake8-bandit (S) security rules
select = ["S"]

[tool.ruff.lint.per-file-ignores]
# pytest requires `assert` - not a real security finding in test files
"tests/**" = ["S101"]