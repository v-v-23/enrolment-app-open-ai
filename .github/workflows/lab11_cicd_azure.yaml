name: lab11_cicd_azure

on:
  # push:
  #   branches:
  #     - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  post_commit_tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install test dependencies
        run: pip install pytest requests "PyJWT>=2.11.0"

      - name: Start services
        run: docker compose up -d --build

      # The tests call database-service on localhost:5002, so wait until it answers
      # instead of racing the container start-up.
      - name: Wait for database-service
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5002/ || true)
            if [ "$code" = "200" ]; then
              echo "database-service is ready"
              exit 0
            fi
            echo "Waiting for database-service ($i/30, got: ${code:-none})"
            sleep 2
          done
          echo "database-service did not become ready" >&2
          docker compose logs database-service
          exit 1

      # GitHub runs steps with "bash -e", so a failing pytest would stop the step before the
      # audit line is written. set +e lets us record PASS/FAIL first, then fail the step.
      - name: Run post-commit tests
        run: |
          mkdir -p reports/lab11
          set +e
          python -m pytest tests/lab11/post_commit/ -v > reports/lab11/test-results.md
          status=$?
          set -e
          echo "{\"status\": \"$([ $status -eq 0 ] && echo PASS || echo FAIL)\", \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" >> reports/lab11/test-audit.jsonl
          exit $status

      - name: Stop services
        if: always()
        run: docker compose down -v

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab11-azure-test-evidence
          path: reports/lab11

  deploy_azure:
    runs-on: ubuntu-latest
    needs: [post_commit_tests]
    if: github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # deploy-azure-env.sh / deploy-azure.sh use "az containerapp"; make sure the extension is present.
      - name: Install Azure Container Apps extension
        run: az extension add --name containerapp --upgrade --yes

      - name: Set up deployment environment
        run: bash scripts/lab11/env-setup.sh

      - name: Build and push images
        run: bash scripts/lab11/build-images.sh

      - name: Azure login (refresh)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Create Container Apps environment
        run: bash scripts/lab11/deploy-azure-env.sh

      - name: Azure login (refresh again)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Container Apps
        run: bash scripts/lab11/deploy-azure.sh

      - name: Validate deployment and generate evidence
        run: bash scripts/lab11/deployment-testing.sh

      - name: Upload deployment evidence
        uses: actions/upload-artifact@v4
        with:
          name: lab11-azure-deployment-evidence
          path: reports/lab11/deployment-results.md
